spring:
  application:
    name: smart-credit-cabinet-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit_cabinet}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

security:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-for-hackathon-32+}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

ml:
  base-url: ${ML_BASE_URL:http://localhost:8001}
  connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${ML_READ_TIMEOUT_MS:10000}
  retries: ${ML_RETRIES:2}

pipeline:
  recovery-after-seconds: ${PIPELINE_RECOVERY_AFTER_SECONDS:120}
  recovery-interval-ms: ${PIPELINE_RECOVERY_INTERVAL_MS:30000}
  disbursement-delay-ms: ${PIPELINE_DISBURSEMENT_DELAY_MS:5000}
  offer-ttl-days: ${OFFER_TTL_DAYS:3}

app:
  seed:
    enabled: ${SEED_ENABLED:true}
    demo-password: ${SEED_PASSWORD:Demo1234!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    ru.backend: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
